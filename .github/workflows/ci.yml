name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow psutil requests pytest protobuf
      - name: Privacy and secrets scan
        run: python tools/scan_private.py
      - name: Run headless test suite
        run: pytest -v
      - name: Smoke-check --doctor CLI
        run: python -m starthub --doctor

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt protobuf
      - name: Privacy and secrets scan
        run: python tools/scan_private.py
      - name: Run full Windows test suite
        run: pytest -v
      - name: Smoke-check --doctor & --render-test
        run: |
          python -m starthub --doctor
          python -m starthub --demo --render-test cache/ci_preview
