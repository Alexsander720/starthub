name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow psutil requests pytest protobuf
      - name: Privacy and secrets scan
        run: python tools/scan_private.py
      - name: Run test suite
        run: pytest -v
